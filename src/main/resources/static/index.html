<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDSY Link Shortener</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #10131a;
            color: #e6e8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1f2b;
            border: 1px solid #2b3242;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p.sub { margin: 0 0 28px; color: #9aa3b5; font-size: 14px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .row { display: flex; gap: 8px; }
        input[type="url"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #2b3242;
            border-radius: 8px;
            background: #10131a;
            color: #e6e8ee;
            font-size: 14px;
        }
        input[type="url"]:focus { outline: none; border-color: #4f6bff; }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4f6bff;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #3e55d6; }
        button:disabled { background: #3a4157; cursor: not-allowed; }
        .result {
            display: none;
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #2b3242;
            border-radius: 8px;
            background: #10131a;
        }
        .result a { color: #7dd3fc; word-break: break-all; }
        .result .orig { color: #9aa3b5; font-size: 12px; margin-top: 6px; word-break: break-all; }
        .error {
            display: none;
            margin-top: 24px;
            padding: 14px 16px;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            background: #2a1212;
            color: #fca5a5;
            font-size: 14px;
        }
        .hint { margin-top: 20px; color: #6b7280; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>EDSY Link Shortener</h1>
        <p class="sub">Paste a long <a href="https://edsy.org" style="color:#7dd3fc">edsy.org</a> link and get a short one back.</p>

        <form id="shorten-form">
            <label for="url">Long link</label>
            <div class="row">
                <input type="url" id="url" name="url" required
                       placeholder="https://edsy.org/#/S:...">
                <button type="submit" id="submit-btn">Shorten</button>
            </div>
        </form>

        <div class="result" id="result">
            <a id="short-link" href="#" target="_blank"></a>
            <div class="orig" id="original-link"></div>
        </div>
        <div class="error" id="error"></div>

        <div class="hint">Short links redirect to the original EDSY build.</div>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const urlInput = document.getElementById('url');
        const submitBtn = document.getElementById('submit-btn');
        const result = document.getElementById('result');
        const shortLink = document.getElementById('short-link');
        const originalLink = document.getElementById('original-link');
        const error = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.style.display = 'none';
            result.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Shortening...';
            try {
                const resp = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput.value.trim() })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }
                shortLink.href = data.shortUrl;
                shortLink.textContent = data.shortUrl;
                originalLink.textContent = data.original;
                result.style.display = 'block';
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Shorten';
            }
        });
    </script>
</body>
</html>
