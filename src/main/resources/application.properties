server.port=443

server.ssl.enabled=true
server.ssl.certificate=classpath:cert/fullchain.cer
server.ssl.certificate-private-key=classpath:cert/nox-edsy-link-shortener.publicvm.com.key

spring.datasource.url=jdbc:h2:file:./data/linkdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
