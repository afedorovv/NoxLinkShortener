name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B -ntp package -DskipTests

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PR_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOST_IP }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: scp -i ~/.ssh/id_ed25519 target/sEdsyLinkShortener-1.0-SNAPSHOT.jar "${{ secrets.USER }}@${{ secrets.IP }}:/opt/sEdsyLinkShortener/app.jar"

      - name: Restart service
        run: ssh -i ~/.ssh/id_ed25519 "${{ secrets.USER }}@${{ secrets.IP }}" "systemctl restart EdsyLinkShortener || true"
